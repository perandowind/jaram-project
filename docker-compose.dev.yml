name: jaram-notification-dev

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: jaram
      POSTGRES_USER: jaram
      POSTGRES_PASSWORD: jaram
    ports:
      - "127.0.0.1:${JARAM_DEV_POSTGRES_PORT:-5434}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jaram -d jaram"]
      interval: 5s
      timeout: 5s
      retries: 12

  rabbitmq:
    image: rabbitmq:4.4.1-management
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: jaram
      RABBITMQ_DEFAULT_PASS: jaram-dev
    ports:
      - "127.0.0.1:${JARAM_DEV_AMQP_PORT:-5672}:5672"
      - "127.0.0.1:${JARAM_DEV_RABBITMQ_UI_PORT:-15672}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      # Run as the broker user so Erlang never initializes a root-owned cookie.
      test: ["CMD", "gosu", "rabbitmq", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  postgres-data:
  rabbitmq-data:
